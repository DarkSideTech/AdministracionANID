services:
  postgres:
    image: postgres:17-alpine
    container_name: anid-postgres
    environment:
      POSTGRES_DB: AUT2Services
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - anid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AUT2Services"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    container_name: anid-mongo
    ports:
      - "27017:27017"
    volumes:
      - anid_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: anid-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__AUT2ServicesConnectionPostgreSql: Host=postgres;Port=5432;Database=AUT2Services;Username=postgres;Password=postgres
      ConnectionStrings__MongoAuditProjection: mongodb://mongo:27017

volumes:
  anid_postgres_data:
  anid_mongo_data:
